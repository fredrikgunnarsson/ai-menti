<!DOCTYPE html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ställ en fråga</title>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      rel="stylesheet"
    />
    <style>
      :root {
        --primary: #008766;
        --primary-dark: #3a56d4;
        --light: #f8f9fa;
        --dark: #12332e;
        --success: #2ec4b6;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      }

      body {
        background-color: var(--dark);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 1rem;
      }

      .container {
        width: 100%;
        max-width: 500px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        padding: 2rem;
        text-align: center;
      }

      h1 {
        color: var(--light);
        margin-bottom: 1rem;
        font-weight: 600;
      }

      .subtitle {
        color: #6c757d;
        margin-bottom: 2rem;
        font-size: 0.9rem;
      }

      #questionForm {
        display: flex;
        flex-direction: column;
      }

      #questionInput {
        padding: 15px;
        border: 2px solid #e9ecef;
        border-radius: 8px;
        font-size: 1rem;
        transition: all 0.3s ease;
        margin-bottom: 1rem;
        resize: none;
        height: 100px;
      }

      #questionInput:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.2);
      }

      button {
        background-color: var(--primary);
        color: white;
        border: none;
        border-radius: 8px;
        padding: 15px; /* Slightly increased padding */
        font-size: 1rem;
        font-weight: 600; /* Bolder text */
        cursor: pointer;
        transition: all 0.3s ease; /* Keep transition */
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }

      button:hover {
        background-color: var(--primary-hover); /* Changed to darker primary */
        transform: translateY(-2px); /* Add subtle lift */
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1); /* Optional: Add subtle shadow */
      }

      button:disabled {
        background-color: #ccc;
        cursor: not-allowed;
      }

      .status {
        margin-top: 1.5rem;
        padding: 0.75rem;
        border-radius: 6px;
        transition: all 0.3s ease;
        opacity: 0;
      }

      .status.success {
        background-color: rgba(46, 196, 182, 0.1);
        color: var(--success);
        opacity: 1;
      }

      .status.error {
        background-color: rgba(231, 29, 54, 0.1);
        color: #e71d36;
        opacity: 1;
      }

      .connection-status {
        position: absolute;
        top: 10px;
        right: 10px;
        padding: 5px 10px;
        border-radius: 20px;
        font-size: 0.8rem;
        display: flex;
        align-items: center;
        gap: 5px;
      }

      .connected {
        background-color: rgba(46, 196, 182, 0.1);
        color: var(--success);
      }

      .disconnected {
        background-color: rgba(231, 29, 54, 0.1);
        color: #e71d36;
      }

      .char-count {
        text-align: right;
        font-size: 0.8rem;
        color: #6c757d;
        margin-bottom: 0.5rem;
      }
    </style>
  </head>
  <body>
    <div class="connection-status disconnected">
      <i class="fas fa-circle"></i>
      <span id="connectionText">Ej ansluten</span>
    </div>

    <div class="container">
      <h1>Ställ en fråga</h1>
      <p class="subtitle">Din fråga visas direkt på presentatörens skärm</p>

      <form id="questionForm">
        <textarea
          id="questionInput"
          placeholder="Skriv din fråga här..."
          maxlength="200"
        ></textarea>
        <div class="char-count"><span id="charCount">0</span>/200</div>
        <button type="submit" id="submitBtn" disabled>
          <i class="fas fa-paper-plane"></i>
          Skicka fråga
        </button>
      </form>

      <div class="status" id="statusMessage"></div>
    </div>

    <!-- Inkludera MQTT.js -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

    <script>
      const questionInput = document.getElementById('questionInput')
      const submitBtn = document.getElementById('submitBtn')
      const statusMessage = document.getElementById('statusMessage')
      const charCount = document.getElementById('charCount')
      const connectionStatus = document.querySelector('.connection-status')
      const connectionText = document.getElementById('connectionText')

      // Teckenräknare
      questionInput.addEventListener('input', () => {
        const length = questionInput.value.length
        charCount.textContent = length

        // Aktivera/avaktivera knapp beroende på om det finns text
        submitBtn.disabled = length === 0
      })

      // Anslut till MQTT-broker
      const client = mqtt.connect('wss://broker.emqx.io:8084/mqtt')

      client.on('connect', () => {
        console.log('Ansluten till MQTT-broker')
        connectionStatus.classList.remove('disconnected')
        connectionStatus.classList.add('connected')
        connectionText.textContent = 'Ansluten'
      })

      client.on('error', (err) => {
        console.error('Anslutningsfel', err)
        connectionStatus.classList.remove('connected')
        connectionStatus.classList.add('disconnected')
        connectionText.textContent = 'Ej ansluten'

        showStatus('Kunde inte ansluta. Försök igen senare.', 'error')
      })

      client.on('offline', () => {
        connectionStatus.classList.remove('connected')
        connectionStatus.classList.add('disconnected')
        connectionText.textContent = 'Ej ansluten'
      })

      // Skicka fråga vid formulärpost
      document
        .getElementById('questionForm')
        .addEventListener('submit', (e) => {
          e.preventDefault()
          const question = questionInput.value.trim()

          if (question) {
            submitBtn.disabled = true
            submitBtn.innerHTML =
              '<i class="fas fa-spinner fa-spin"></i> Skickar...'

            try {
              client.publish(
                'question/topic/ad2j-123jf-343juv',
                question,
                (err) => {
                  if (err) {
                    console.error('Fel vid publicering', err)
                    showStatus(
                      'Kunde inte skicka frågan. Försök igen.',
                      'error'
                    )
                  } else {
                    showStatus('Frågan skickades!', 'success')
                    questionInput.value = ''
                    charCount.textContent = '0'
                  }

                  submitBtn.disabled = question.length === 0
                  submitBtn.innerHTML =
                    '<i class="fas fa-paper-plane"></i> Skicka fråga'
                }
              )
            } catch (error) {
              console.error('Undantag vid publicering', error)
              showStatus('Kunde inte skicka frågan. Försök igen.', 'error')
              submitBtn.disabled = false
              submitBtn.innerHTML =
                '<i class="fas fa-paper-plane"></i> Skicka fråga'
            }
          }
        })

      function showStatus(message, type) {
        statusMessage.style.opacity = '1'
        statusMessage.textContent = message
        statusMessage.className = 'status'
        statusMessage.classList.add(type)

        // Dölj efter 3 sekunder...
        setTimeout(() => {
          statusMessage.style.opacity = '0'
        }, 3000)
      }
    </script>
  </body>
</html>
