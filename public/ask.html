<!DOCTYPE html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skicka en fråga</title>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="ask-page">
    <main class="page-shell ask-shell">
      <section class="ask-card" aria-label="Frågeformulär">
        <div class="ask-topline">
          <span class="ask-kicker">Livefråga</span>
          <div class="connection-badge" data-state="disconnected" aria-live="polite">
            <i class="fas fa-circle" aria-hidden="true"></i>
            <span id="connectionText">Ej ansluten</span>
          </div>
        </div>

        <div class="ask-intro">
          <h1 class="ask-title">Ställ en fråga</h1>
        </div>

        <form id="questionForm" class="ask-form">
          <label class="ask-field" for="questionInput">
            <div class="ask-field-head">
              <span class="ask-label">Din fråga</span>
              <span class="ask-count"><span id="charCount">0</span>/200</span>
            </div>
            <textarea
              id="questionInput"
              class="ask-input"
              placeholder="Skriv din fråga här..."
              maxlength="200"
            ></textarea>
          </label>

          <div class="ask-actions">
            <p class="ask-help">Visas direkt hos presentatören.</p>
            <button type="submit" id="submitBtn" class="ask-submit" disabled>
              <i class="fas fa-paper-plane" aria-hidden="true"></i>
              Skicka fråga
            </button>
          </div>
        </form>

        <div class="ask-status" id="statusMessage" data-visible="false" aria-live="polite"></div>
      </section>
    </main>

    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <script>
      const questionInput = document.getElementById('questionInput')
      const submitBtn = document.getElementById('submitBtn')
      const statusMessage = document.getElementById('statusMessage')
      const charCount = document.getElementById('charCount')
      const connectionStatus = document.querySelector('.connection-badge')
      const connectionText = document.getElementById('connectionText')
      let statusTimeoutId

      questionInput.addEventListener('input', () => {
        const length = questionInput.value.length
        charCount.textContent = length
        submitBtn.disabled = length === 0
      })

      const client = mqtt.connect('wss://broker.emqx.io:8084/mqtt')

      client.on('connect', () => {
        connectionStatus.dataset.state = 'connected'
        connectionText.textContent = 'Ansluten'
      })

      client.on('error', (err) => {
        console.error('Anslutningsfel', err)
        connectionStatus.dataset.state = 'disconnected'
        connectionText.textContent = 'Ej ansluten'
        showStatus('Kunde inte ansluta. Försök igen senare.', 'error')
      })

      client.on('offline', () => {
        connectionStatus.dataset.state = 'disconnected'
        connectionText.textContent = 'Ej ansluten'
      })

      document.getElementById('questionForm').addEventListener('submit', (e) => {
        e.preventDefault()
        const question = questionInput.value.trim()

        if (!question) {
          return
        }

        submitBtn.disabled = true
        submitBtn.innerHTML =
          '<i class="fas fa-spinner fa-spin" aria-hidden="true"></i> Skickar...'

        try {
          client.publish('question/topic/ad2j-123jf-343juv', question, (err) => {
            if (err) {
              console.error('Fel vid publicering', err)
              showStatus('Kunde inte skicka frågan. Försök igen.', 'error')
            } else {
              showStatus('Frågan skickades.', 'success')
              questionInput.value = ''
              charCount.textContent = '0'
            }

            submitBtn.disabled = questionInput.value.trim().length === 0
            submitBtn.innerHTML =
              '<i class="fas fa-paper-plane" aria-hidden="true"></i> Skicka fråga'
          })
        } catch (error) {
          console.error('Undantag vid publicering', error)
          showStatus('Kunde inte skicka frågan. Försök igen.', 'error')
          submitBtn.disabled = false
          submitBtn.innerHTML =
            '<i class="fas fa-paper-plane" aria-hidden="true"></i> Skicka fråga'
        }
      })

      function showStatus(message, type) {
        statusMessage.textContent = message
        statusMessage.dataset.tone = type
        statusMessage.dataset.visible = 'true'

        clearTimeout(statusTimeoutId)

        statusTimeoutId = setTimeout(() => {
          statusMessage.dataset.visible = 'false'
        }, 3000)
      }
    </script>
  </body>
</html>
