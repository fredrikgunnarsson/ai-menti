<!DOCTYPE html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Presentatörsvy</title>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs/qrcode.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="presenter-page">
    <main class="presenter-frame">
      <section class="presenter-topbar">
        <header class="presenter-hero">
          <p class="eyebrow">Livefrågor</p>
          <div class="presenter-meta" aria-label="Status">
            <span class="presenter-stat">
              <strong id="questionCount">0</strong>
              <span>frågor</span>
            </span>
            <span class="presenter-stat connection-badge" data-state="disconnected">
              <span id="connectionStatus">Ansluter...</span>
            </span>
          </div>
        </header>

        <aside class="presenter-controls" aria-label="Presenter controls">
          <button class="presenter-control button-secondary" id="clearBtn" type="button">Rensa alla</button>
          <button class="presenter-control button-secondary" id="themeToggle" type="button">Mörkt läge</button>
          <button class="presenter-control button-secondary" id="fontSizeBtn" type="button">Textstorlek</button>
          <button class="presenter-control button-primary" id="qrToggleBtn" type="button">Anslut publik</button>
        </aside>
      </section>

      <section class="qr-region" id="qrCodeRegion" aria-live="polite" hidden>
      </section>

      <section class="presenter-stage" aria-label="Question list">
        <div id="emptyState" class="empty-state-wrap" hidden>
          <p class="empty-state">Inga frågor än. När någon skickar in en fråga visas den här direkt.</p>
        </div>

        <div class="questions-layout" id="questionsLayout">
          <section class="questions-wall">
            <div class="question-list" id="questionList" aria-live="polite"></div>
          </section>
        </div>
      </section>
    </main>

    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <script>
      const emptyState = document.getElementById('emptyState')
      const questionsLayout = document.getElementById('questionsLayout')
      const questionList = document.getElementById('questionList')
      const connectionStatus = document.getElementById('connectionStatus')
      const questionCountEl = document.getElementById('questionCount')
      const clearBtn = document.getElementById('clearBtn')
      const themeToggle = document.getElementById('themeToggle')
      const fontSizeBtn = document.getElementById('fontSizeBtn')
      const qrToggleBtn = document.getElementById('qrToggleBtn')
      const qrCodeRegion = document.getElementById('qrCodeRegion')
      const presenterStatus = document.querySelector('.connection-badge')
      const STORAGE_KEY = 'ai-menti.presenter-state'

      let isDarkMode = false
      let fontSizeMode = 'normal'
      let questionCount = 0
      let qrCodeGenerated = false
      let questions = []
      let questionIdCounter = 0
      let newestQuestionId = null
      let askPageUrl = getAskPageUrl()

      restorePresenterState()
      renderQuestions()
      applyPresenterPreferences()

      const client = mqtt.connect('wss://broker.emqx.io:8084/mqtt')

      client.on('connect', () => {
        presenterStatus.dataset.state = 'connected'
        connectionStatus.textContent = 'Ansluten'

        client.subscribe('question/topic/ad2j-123jf-343juv', (err) => {
          if (err) {
            console.error('Prenumerationsfel', err)
            presenterStatus.dataset.state = 'disconnected'
            connectionStatus.textContent = 'Fel vid prenumeration'
          }
        })
      })

      client.on('error', (err) => {
        console.error('Anslutningsfel', err)
        presenterStatus.dataset.state = 'disconnected'
        connectionStatus.textContent = 'Anslutningsfel'
      })

      client.on('offline', () => {
        presenterStatus.dataset.state = 'disconnected'
        connectionStatus.textContent = 'Frånkopplad'
      })

      client.on('message', (topic, message) => {
        if (topic === 'question/topic/ad2j-123jf-343juv') {
          addQuestion(message.toString())
        }
      })

      function addQuestion(text) {
        const question = {
          id: createQuestionId(),
          text,
          receivedAt: getCurrentTimeLabel(),
          isAnswered: false,
          isActive: false,
        }

        questions.unshift(question)
        newestQuestionId = question.id
        savePresenterState()
        renderQuestions()
      }

      function renderQuestions() {
        questionList.innerHTML = ''

        questions.forEach((question) => {
          const questionItem = document.createElement('article')
          questionItem.className = 'question-card'
          questionItem.dataset.questionId = question.id
          questionItem.tabIndex = 0

          if (question.isAnswered) {
            questionItem.classList.add('is-answered')
          }

          if (question.isActive) {
            questionItem.classList.add('is-active')
          }

          if (question.id === newestQuestionId) {
            questionItem.dataset.new = 'true'
            window.setTimeout(() => {
              questionItem.dataset.new = 'false'
            }, 2400)
          }

          const questionTop = document.createElement('div')
          questionTop.className = 'question-card__top'

          const questionContent = document.createElement('div')
          questionContent.className = 'question-content'

          const questionState = document.createElement('p')
          questionState.className = 'question-state'
          questionContent.appendChild(questionState)

          const questionBody = document.createElement('p')
          questionBody.className = 'question-body'
          questionBody.textContent = question.text
          questionContent.appendChild(questionBody)

          const actionGroup = document.createElement('div')
          actionGroup.className = 'question-actions'

          const doneButton = document.createElement('button')
          doneButton.className = 'question-done'
          doneButton.setAttribute('type', 'button')
          doneButton.textContent = 'Klar'

          const removeButton = document.createElement('button')
          removeButton.className = 'question-remove'
          removeButton.setAttribute('type', 'button')
          removeButton.setAttribute('aria-label', 'Ta bort fråga')
          removeButton.textContent = 'Ta bort'

          actionGroup.appendChild(doneButton)
          actionGroup.appendChild(removeButton)

          questionTop.appendChild(questionContent)
          questionTop.appendChild(actionGroup)
          questionItem.appendChild(questionTop)

          const questionMeta = document.createElement('div')
          questionMeta.className = 'question-meta'
          questionMeta.textContent = question.receivedAt
          questionItem.appendChild(questionMeta)

          doneButton.addEventListener('click', (event) => {
            event.stopPropagation()
            markQuestionAnswered(question.id)
          })

          removeButton.addEventListener('click', (event) => {
            event.stopPropagation()
            removeQuestion(question.id)
          })

          questionItem.addEventListener('click', () => {
            setActiveQuestion(question.id)
          })

          questionItem.addEventListener('keydown', (event) => {
            if (event.key === 'Enter' || event.key === ' ') {
              event.preventDefault()
              setActiveQuestion(question.id)
            }
          })

          questionList.appendChild(questionItem)
        })

        newestQuestionId = null
        syncQuestionLayout()
      }

      function createQuestionId() {
        questionIdCounter += 1
        return 'q-' + Date.now() + '-' + questionIdCounter
      }

      function getCurrentTimeLabel() {
        const now = new Date()
        return now.toLocaleTimeString([], {
          hour: '2-digit',
          minute: '2-digit',
        })
      }

      function setActiveQuestion(questionId) {
        questions = questions.map((question) => {
          if (question.id === questionId) {
            return {
              ...question,
              isActive: true,
              isAnswered: false,
            }
          }

          return {
            ...question,
            isActive: false,
          }
        })

        savePresenterState()
        renderQuestions()
      }

      function markQuestionAnswered(questionId) {
        questions = questions.map((question) => {
          if (question.id === questionId) {
            return {
              ...question,
              isActive: false,
              isAnswered: true,
            }
          }

          return question
        })

        const nextQuestion = questions.find((question) => !question.isAnswered && question.id !== questionId)

        if (nextQuestion) {
          questions = questions.map((question) => ({
            ...question,
            isActive: question.id === nextQuestion.id,
          }))
        }

        savePresenterState()
        renderQuestions()
      }

      function removeQuestion(questionId) {
        questions = questions.filter((question) => question.id !== questionId)
        savePresenterState()
        renderQuestions()
      }

      qrToggleBtn.addEventListener('click', () => {
        if (qrCodeRegion.hidden) {
          showQrRegion()
        } else {
          hideQrRegion()
        }

        savePresenterState()
      })

      function generateQRCode() {
        new QRCode(qrCodeRegion, {
          text: askPageUrl,
          width: 256,
          height: 256,
          colorDark: '#12332e',
          colorLight: '#ffffff',
          correctLevel: QRCode.CorrectLevel.H,
        })
      }

      clearBtn.addEventListener('click', () => {
        questions = []
        savePresenterState()
        renderQuestions()
      })

      themeToggle.addEventListener('click', () => {
        if (isDarkMode) {
          isDarkMode = false
        } else {
          isDarkMode = true
        }

        applyPresenterPreferences()
        savePresenterState()
      })

      fontSizeBtn.addEventListener('click', () => {
        if (fontSizeMode === 'normal') {
          fontSizeMode = 'large'
        } else if (fontSizeMode === 'large') {
          fontSizeMode = 'small'
        } else {
          fontSizeMode = 'normal'
        }

        applyPresenterPreferences()
        savePresenterState()
      })

      function syncQuestionLayout() {
        const totalQuestions = questions.length
        questionCount = totalQuestions
        questionCountEl.textContent = String(totalQuestions)
        emptyState.hidden = totalQuestions !== 0
        questionsLayout.hidden = totalQuestions === 0

        if (totalQuestions === 0) {
          showQrRegion()
        }
      }

      function applyPresenterPreferences() {
        document.body.classList.toggle('dark-mode', isDarkMode)
        document.body.dataset.fontSize = fontSizeMode
        themeToggle.textContent = isDarkMode ? 'Ljust läge' : 'Mörkt läge'
        fontSizeBtn.dataset.size = fontSizeMode
        fontSizeBtn.textContent =
          fontSizeMode === 'large'
            ? 'Textstorlek: L'
            : fontSizeMode === 'small'
              ? 'Textstorlek: S'
              : 'Textstorlek: M'

        if (!qrCodeRegion.hidden && !qrCodeGenerated) {
          generateQRCode()
          qrCodeGenerated = true
        }

        if (qrCodeRegion.hidden) {
          qrToggleBtn.textContent = 'Anslut publik'
        } else {
          qrToggleBtn.textContent = 'Dölj publiklänk'
        }
      }

      function showQrRegion() {
        qrCodeRegion.hidden = false

        if (!qrCodeGenerated) {
          generateQRCode()
          qrCodeGenerated = true
        }

        qrToggleBtn.textContent = 'Dölj publiklänk'
      }

      function hideQrRegion() {
        qrCodeRegion.hidden = true
        qrToggleBtn.textContent = 'Anslut publik'
      }

      function getAskPageUrl() {
        let currentUrl = window.location.href
        const lastSlashIndex = currentUrl.lastIndexOf('/')

        if (lastSlashIndex !== -1) {
          currentUrl = currentUrl.substring(0, lastSlashIndex + 1) + 'ask.html'
        }

        return currentUrl
      }

      function savePresenterState() {
        const state = {
          isDarkMode,
          fontSizeMode,
          isQrVisible: !qrCodeRegion.hidden,
          questions,
          questionIdCounter,
        }

        localStorage.setItem(STORAGE_KEY, JSON.stringify(state))
      }

      function restorePresenterState() {
        const savedState = localStorage.getItem(STORAGE_KEY)

        if (!savedState) {
          return
        }

        try {
          const parsedState = JSON.parse(savedState)
          isDarkMode = parsedState.isDarkMode === true
          fontSizeMode =
            parsedState.fontSizeMode === 'large' || parsedState.fontSizeMode === 'small'
              ? parsedState.fontSizeMode
              : 'normal'
          qrCodeRegion.hidden = parsedState.isQrVisible !== true
          questions = Array.isArray(parsedState.questions) ? parsedState.questions : []
          questionIdCounter = Number.isInteger(parsedState.questionIdCounter)
            ? parsedState.questionIdCounter
            : 0
        } catch (error) {
          console.error('Kunde inte läsa sparat presentatörsläge', error)
        }
      }
    </script>
  </body>
</html>
