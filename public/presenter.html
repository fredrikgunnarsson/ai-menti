<!DOCTYPE html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Presentatörsvy</title>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs/qrcode.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="presenter-page">
    <main class="page-shell presenter-stack">
      <section class="presenter-topbar">
        <div class="presenter-head">
          <div class="presenter-head-copy">
            <span class="presenter-kicker">Livefrågor</span>
            <h1 class="presenter-title">Presentatörsvy</h1>
          </div>
          <div class="presenter-meta">
            <div class="connection-badge" data-state="disconnected">
              <i class="fas fa-circle" aria-hidden="true"></i>
              <span id="connectionStatus">Ansluter...</span>
            </div>
            <div class="presenter-count">
              <span id="questionCount">0</span>
              <span>frågor</span>
            </div>
          </div>
        </div>

        <div class="presenter-controls" aria-label="Presentatörskontroller">
          <button id="clearBtn" class="presenter-control">
            <i class="fas fa-trash" aria-hidden="true"></i>
            Rensa alla
          </button>
          <button id="themeToggle" class="presenter-control">
            <i class="fas fa-sun" aria-hidden="true"></i>
            Ljust läge
          </button>
          <button id="fontSizeBtn" class="presenter-control">
            <i class="fas fa-text-height" aria-hidden="true"></i>
            Textstorlek
          </button>
          <button id="qrToggleBtn" class="presenter-control">
            <i class="fas fa-qrcode" aria-hidden="true"></i>
            Visa QR-kod
          </button>
        </div>
      </section>

      <section id="qrCodeContainer" class="presenter-qr" aria-live="polite" hidden>
        <p>Skanna för att öppna frågesidan på mobilen.</p>
      </section>

      <section class="presenter-stage">
        <div class="presenter-empty" id="noQuestions">
          <div>
            <p>Inga frågor än. När någon skickar in en fråga visas den här direkt.</p>
          </div>
        </div>
        <div id="questionsContainer" class="presenter-questions" aria-live="polite"></div>
      </section>
    </main>

    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <script>
      const questionsContainer = document.getElementById('questionsContainer')
      const noQuestionsEl = document.getElementById('noQuestions')
      const connectionStatus = document.getElementById('connectionStatus')
      const questionCountEl = document.getElementById('questionCount')
      const clearBtn = document.getElementById('clearBtn')
      const themeToggle = document.getElementById('themeToggle')
      const fontSizeBtn = document.getElementById('fontSizeBtn')
      const qrToggleBtn = document.getElementById('qrToggleBtn')
      const qrCodeContainer = document.getElementById('qrCodeContainer')
      const presenterStatus = document.querySelector('.connection-badge')

      let isDarkMode = false
      let fontSizeMode = 'normal'
      let questionCount = 0
      let qrCodeGenerated = false

      const client = mqtt.connect('wss://broker.emqx.io:8084/mqtt')

      client.on('connect', () => {
        presenterStatus.dataset.state = 'connected'
        connectionStatus.textContent = 'Ansluten'

        client.subscribe('question/topic/ad2j-123jf-343juv', (err) => {
          if (err) {
            console.error('Prenumerationsfel', err)
            presenterStatus.dataset.state = 'disconnected'
            connectionStatus.textContent = 'Fel vid prenumeration'
          }
        })
      })

      client.on('error', (err) => {
        console.error('Anslutningsfel', err)
        presenterStatus.dataset.state = 'disconnected'
        connectionStatus.textContent = 'Anslutningsfel'
      })

      client.on('offline', () => {
        presenterStatus.dataset.state = 'disconnected'
        connectionStatus.textContent = 'Frånkopplad'
      })

      client.on('message', (topic, message) => {
        if (topic === 'question/topic/ad2j-123jf-343juv') {
          addQuestion(message.toString())
        }
      })

      function addQuestion(text) {
        noQuestionsEl.hidden = true

        const now = new Date()
        const timeStr = now.toLocaleTimeString([], {
          hour: '2-digit',
          minute: '2-digit',
        })

        const questionEl = document.createElement('article')
        questionEl.className = 'presenter-question'

        const bodyEl = document.createElement('p')
        bodyEl.className = 'presenter-question-body'
        bodyEl.textContent = text
        questionEl.appendChild(bodyEl)

        const metaEl = document.createElement('div')
        metaEl.className = 'presenter-question-meta'
        metaEl.innerHTML =
          '<i class="fas fa-clock" aria-hidden="true"></i><span>Inkommen ' +
          timeStr +
          '</span>'
        questionEl.appendChild(metaEl)

        const deleteBtn = document.createElement('button')
        deleteBtn.className = 'presenter-delete'
        deleteBtn.setAttribute('type', 'button')
        deleteBtn.setAttribute('aria-label', 'Ta bort fråga')
        deleteBtn.innerHTML = '<i class="fas fa-trash" aria-hidden="true"></i>'
        questionEl.appendChild(deleteBtn)

        deleteBtn.addEventListener('click', (event) => {
          event.stopPropagation()
          questionEl.remove()
          questionCount--
          questionCountEl.textContent = questionCount

          if (questionCount === 0) {
            noQuestionsEl.hidden = false
          }
        })

        questionEl.addEventListener('click', () => {
          questionEl.classList.toggle('is-answered')
        })

        questionsContainer.prepend(questionEl)
        questionCount++
        questionCountEl.textContent = questionCount
      }

      qrToggleBtn.addEventListener('click', () => {
        if (qrCodeContainer.hidden) {
          qrCodeContainer.hidden = false

          if (!qrCodeGenerated) {
            generateQRCode()
            qrCodeGenerated = true
          }

          qrToggleBtn.innerHTML =
            '<i class="fas fa-times" aria-hidden="true"></i> Dölj QR-kod'
        } else {
          qrCodeContainer.hidden = true
          qrToggleBtn.innerHTML =
            '<i class="fas fa-qrcode" aria-hidden="true"></i> Visa QR-kod'
        }
      })

      function generateQRCode() {
        let currentUrl = window.location.href
        const lastSlashIndex = currentUrl.lastIndexOf('/')

        if (lastSlashIndex !== -1) {
          currentUrl = currentUrl.substring(0, lastSlashIndex + 1) + 'ask.html'
        }

        new QRCode(qrCodeContainer, {
          text: currentUrl,
          width: 256,
          height: 256,
          colorDark: '#12332e',
          colorLight: '#ffffff',
          correctLevel: QRCode.CorrectLevel.H,
        })

        qrCodeContainer.addEventListener('click', () => {
          qrCodeContainer.hidden = true
          qrToggleBtn.innerHTML =
            '<i class="fas fa-qrcode" aria-hidden="true"></i> Visa QR-kod'
        })
      }

      clearBtn.addEventListener('click', () => {
        questionsContainer.innerHTML = ''
        noQuestionsEl.hidden = false
        questionCount = 0
        questionCountEl.textContent = '0'
      })

      themeToggle.addEventListener('click', () => {
        if (isDarkMode) {
          document.body.classList.remove('dark-mode')
          themeToggle.innerHTML =
            '<i class="fas fa-moon" aria-hidden="true"></i> Mörkt läge'
          isDarkMode = false
        } else {
          document.body.classList.add('dark-mode')
          themeToggle.innerHTML =
            '<i class="fas fa-sun" aria-hidden="true"></i> Ljust läge'
          isDarkMode = true
        }
      })

      fontSizeBtn.addEventListener('click', () => {
        if (fontSizeMode === 'normal') {
          document.body.dataset.fontSize = 'large'
          fontSizeMode = 'large'
        } else if (fontSizeMode === 'large') {
          document.body.dataset.fontSize = 'small'
          fontSizeMode = 'small'
        } else {
          document.body.dataset.fontSize = 'normal'
          fontSizeMode = 'normal'
        }
      })
    </script>
  </body>
</html>
